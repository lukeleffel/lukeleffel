<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap');
:root{--bone:#F7F6F2;--ink:#16140F;--stone:#8A857C;--hair:#E0DCD2;--grad:linear-gradient(100deg,#A8C2EF,#C6AEE2,#F0AFCB);}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bone);color:var(--ink);font-family:'Inter',sans-serif;font-weight:300;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}
::selection{background:#C6AEE2;color:var(--ink);}
a:focus-visible,button:focus-visible{outline:2px solid #C6AEE2;outline-offset:3px;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;}}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:24px 5vw;background:rgba(247,246,242,.96);}
.nav__mark{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.06em;}
.nav__links{display:flex;align-items:center;gap:28px;}
.nav__links a{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.nav__links a:hover{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.nav__burger{display:none;flex-direction:column;justify-content:center;gap:5px;width:36px;height:36px;background:none;border:none;cursor:pointer;padding:4px;}
.nav__burger span{display:block;width:24px;height:1.5px;background:var(--ink);transition:transform .3s ease,opacity .3s ease;}
.nav__burger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.nav__burger.open span:nth-child(2){opacity:0;}
.nav__burger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}
.nav__mobile{display:none;position:fixed;inset:0;z-index:190;background:var(--bone);flex-direction:column;align-items:center;justify-content:center;gap:32px;}
.nav__mobile.open{display:flex;}
.nav__mobile a{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:.04em;}
.nav__mobile a:hover{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
@media(max-width:760px){.nav__links{display:none;}.nav__burger{display:flex;}}

/* HEADER */
.project-head{padding:140px 6vw 56px;text-align:center;}
.project-head__title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,7vw,96px);line-height:.96;letter-spacing:.01em;}
.project-head__title a:hover{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

/* ALIGNED GRID: six columns on a square unit.
   landscape = 3 wide x 2 tall, portrait = 2 wide x 3 tall, wide = 6 x 4.
   Every row of photos lines up edge to edge. */
.gal{container-type:inline-size;padding:0 6vw 8vw;}
.grid{--g:10px;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:calc((100cqw - 5 * var(--g)) / 6);gap:var(--g);}
.c{overflow:hidden;background:#E8E4DB;}
.c img{width:100%;height:100%;object-fit:cover;}
.c.l{grid-column:span 3;grid-row:span 2;}
.c.p{grid-column:span 2;grid-row:span 3;}
.c.w{grid-column:span 6;grid-row:span 4;}
@media(max-width:700px){
  .gal{padding:0 4vw 12vw;}
  .grid{--g:6px;grid-template-columns:repeat(2,1fr);grid-auto-rows:auto;grid-auto-flow:dense;}
  .c.p{grid-column:span 1;grid-row:auto;aspect-ratio:2/3;}
  .c.l,.c.w{grid-column:span 2;grid-row:auto;aspect-ratio:3/2;}
}

/* BACK + FOOTER */
.cycle{padding:48px 6vw;display:flex;justify-content:space-between;align-items:center;}
.cycle__arrow{display:inline-flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);transition:color .2s ease;}
.cycle__arrow:hover{color:var(--ink);}
.cycle__arrow-icon{font-family:'Bebas Neue',sans-serif;font-size:22px;transition:transform .2s ease;}
.cycle__arrow--prev:hover .cycle__arrow-icon{transform:translateX(-4px);}
.footer{background:var(--ink);padding:32px 5vw;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(247,246,242,.3);}
.footer a:hover{color:rgba(247,246,242,.7);}
.footer__links{display:flex;gap:24px;flex-wrap:wrap;}
</style>
</head>

<script>
const burger=document.getElementById('burger'),mobileNav=document.getElementById('mobileNav');
burger.addEventListener('click',()=>{burger.classList.toggle('open');mobileNav.classList.toggle('open');document.body.style.overflow=mobileNav.classList.contains('open')?'hidden':'';});
mobileNav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{burger.classList.remove('open');mobileNav.classList.remove('open');document.body.style.overflow='';}));
document.querySelectorAll('.c img').forEach(img=>img.addEventListener('error',()=>{img.closest('.c').style.display='none';}));
</script>
