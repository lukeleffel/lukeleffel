<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap');

:root{
  --bone:#F7F6F2;
  --ink:#16140F;
  --stone:#8A857C;
  --hair:#E0DCD2;
  --grad:linear-gradient(100deg,#A8C2EF,#C6AEE2,#F0AFCB);
}

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bone);color:var(--ink);font-family:'Inter',sans-serif;font-weight:300;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}
::selection{background:#C6AEE2;color:var(--ink);}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;}}
a:focus-visible,button:focus-visible{outline:2px solid #C6AEE2;outline-offset:3px;}

/* NAV */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:24px 5vw;
  background:rgba(247,246,242,.96);
}
.nav__mark{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.06em;}
.nav__links{display:flex;align-items:center;gap:36px;}
.nav__links a{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;position:relative;padding-bottom:2px;}
.nav__links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--grad);transition:width .25s ease;}
.nav__links a:hover::after{width:100%;}
.nav__links a:hover{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.nav__links a[data-pending]{color:var(--stone);pointer-events:none;}
@media(max-width:760px){.nav__links{display:none;}}

/* PROJECT HEADER */
.project-head{
  padding:140px 6vw 80px;
  text-align:center;
}
.project-head__title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(40px,7vw,96px);
  line-height:.96;letter-spacing:.01em;
}
.project-head__title a{transition:color .2s ease;}
.project-head__title a:hover{
  background:var(--grad);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}

/* ORGANIC GALLERY — rows of 1 or 2 photos, randomized horizontal placement,
   moderate consistent gaps to avoid large empty holes */
.stack{
  padding:4vw 6vw 8vw;
  display:flex;
  flex-direction:column;
  gap:7vw;
}
.row{
  display:flex;
  align-items:flex-start;
}
.row--single{justify-content:center;}
.row--pair{justify-content:space-between;gap:4vw;}

.stack__item{}
.stack__item img{width:100%;height:auto;display:block;}
.stack__caption{margin-top:14px;font-size:13px;color:var(--stone);}

/* Width variants for items within a row — kept within a moderate range
   (44–84% of row width) so no single photo creates a huge empty gap
   next to it */
.row--single .stack__item{width:62%;}
.row--single .stack__item--wide{width:78%;}
.row--single .stack__item--narrow{width:50%;}
.row--single .stack__item--left{margin-right:auto;}
.row--single .stack__item--right{margin-left:auto;}

.row--pair .stack__item{width:46%;}
.row--pair .stack__item--small{width:38%;}
.row--pair .stack__item--large{width:54%;}

/* Vertical nudge only — no rotation. Kept modest so rows stay
   visually anchored to each other rather than drifting apart. */
.stack__item--drop{margin-top:3vw;}
.stack__item--lift{margin-top:-2vw;}

@media(max-width:760px){
  .stack{gap:10vw;}
  .row{flex-wrap:wrap;}
  .row--single .stack__item,
  .row--single .stack__item--wide,
  .row--single .stack__item--narrow,
  .row--pair .stack__item,
  .row--pair .stack__item--small,
  .row--pair .stack__item--large{
    width:100%;
  }
  .row--pair{flex-direction:column;gap:8vw;}
  .stack__item{margin-top:0 !important;margin-left:0 !important;margin-right:0 !important;}
}

/* PREV / NEXT CYCLE */
.cycle{
  padding:48px 6vw;
  display:flex;justify-content:space-between;align-items:center;
}
.cycle__arrow{
  display:inline-flex;align-items:center;gap:12px;
  font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--stone);
  transition:color .2s ease;
}
.cycle__arrow:hover{color:var(--ink);}
.cycle__arrow-icon{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;
  transition:transform .2s ease;
}
.cycle__arrow--prev:hover .cycle__arrow-icon{transform:translateX(-4px);}
.cycle__arrow--next:hover .cycle__arrow-icon{transform:translateX(4px);}

/* FOOTER */
.footer{
  background:var(--ink);
  padding:32px 5vw;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(247,246,242,.3);
}
.footer a:hover{color:rgba(247,246,242,.7);}
.footer__links{display:flex;gap:24px;flex-wrap:wrap;}
</style>

<script>
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 20);
});

const burger = document.getElementById('burger');
const mobileNav = document.getElementById('mobileNav');
burger.addEventListener('click', () => {
  burger.classList.toggle('open');
  mobileNav.classList.toggle('open');
  document.body.style.overflow = mobileNav.classList.contains('open') ? 'hidden' : '';
});
mobileNav.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => {
    burger.classList.remove('open');
    mobileNav.classList.remove('open');
    document.body.style.overflow = '';
  });
});

// Hide any photo slot with no real URL or that fails to load
document.querySelectorAll('.stack__item img').forEach(img => {
  const src = img.getAttribute('src') || '';
  const isPlaceholder = src.indexOf('PASTE_IMAGE_URL') === 0 || src.trim() === '' || src === 'paste here' || src === 'IMAGE HERE' || src === 'IMAGE';
  const hideSlot = () => {
    const item = img.closest('.stack__item');
    if (item) item.style.display = 'none';
  };
  if (isPlaceholder) { hideSlot(); }
  else { img.addEventListener('error', hideSlot); }
});
</script>
